<div class="page-share">
  
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}" 
    onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); 
    return false;" class="btn btn--facebook btn--small">
    <i class="fab fa-fw fa-facebook" aria-hidden="true"></i> 
    <span>{{ site.data.text[site.locale].share | default: '' }}</span>
  </a>

  <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}" 
    onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); 
    return false;" class="btn btn--twitter btn--small">
    <i class="fab fa-fw fa-twitter" aria-hidden="true"></i> 
    <span>{{ site.data.text[site.locale].tweet | default: '' }}</span>
  </a>


  <a href="https://www.youtube.com/channel/YourChannelID?u={{ page.url | absolute_url | url_encode }}"
    onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); 
    return false;" class="btn btn--youtube btn--small">
    <i class="fab fa-fw fa-youtube" aria-hidden="true"></i> 
    <span>{{ site.data.text[site.locale].subscribe | default: '' }}</span>
  </a>

</div>
